<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Boleta Electoral Nuevo León 2027</title>

    <style>

        body{
            font-family: Arial;
            background-color: #f2f2f2;
            text-align: center;
        }

        h1{
            background-color: #b30000;
            color: white;
            padding: 20px;
            border-radius: 10px;
        }

        .candidato{
            background-color: white;
            width: 500px;
            margin: 20px auto;
            padding: 20px;
            border-radius: 15px;
            border: 3px solid gray;
            box-shadow: 0px 0px 10px gray;
        }

        .foto{
            width: 200px;
            border-radius: 10px;
        }

        .partido{
            width: 80px;
            margin: 10px;
        }

        p{
            font-size: 18px;
        }

    </style>

</head>

<body>

    <h1>Boleta Electoral - Nuevo León 2027</h1>

    <div class="candidato">

        <h2>Mariana Rodrigues</h2>

        <img src="mariana.jpg" class="foto">

        <br><br>

        <img src="mc.png" class="partido">

        <p>
            Movimiento Ciudadano
        </p>

    </div>

    <div class="candidato">

        <h2>Adrián de la Garza</h2>

        <img src="adrian.jpg" class="foto">

        <br><br>

        <img src="pri.png" class="partido">
        <img src="prd.png" class="partido">

        <p>
            Coalición PRI - PRD
        </p>

    </div>

    <div class="candidato">

        <h2>Clara Luz Flores</h2>

        <img src="clara.jpg" class="foto">

        <br><br>

        <img src="morena.png" class="partido">
        <img src="pt.png" class="partido">
        <img src="pvem.png" class="partido">

        <p>
            Morena - PT - PVEM
        </p>

    </div>

    <div class="candidato">

        <h2>Fernando Larrazábal</h2>

        <img src="fernando.jpg" class="foto">

        <br><br>

        <img src="pan.png" class="partido">

        <p>
            Partido Acción Nacional
        </p>

    </div>

</body>

</html>
